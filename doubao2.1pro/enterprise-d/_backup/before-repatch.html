<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>U.S.S. Enterprise NCC-1701-D · Galaxy Class</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M16 4 L27 26 L16 21 L5 26 Z' fill='%23ff9d3c'/%3E%3Ccircle cx='16' cy='15' r='3.4' fill='%23000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Antonio:wght@500;700&family=Saira+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  --lcars-orange:#ff9d3c; --lcars-amber:#ffb84d; --lcars-peach:#ffc38a;
  --lcars-magenta:#d36ee0; --lcars-purple:#9a7ee8; --lcars-blue:#7c9bea;
  --lcars-teal:#5fc7c0; --lcars-red:#e2574c; --lcars-bg:#05060a;
  --lcars-ink:#0a0a12;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--lcars-orange);
  font-family:'Saira Condensed','Arial Narrow',Arial,sans-serif;user-select:none}
#app{position:fixed;inset:0}
#app canvas{display:block}
/* ============ 加载屏 ============ */
#loading{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:opacity .8s ease}
#loading .delta{width:84px;height:84px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
#loading h1{font-family:Antonio,sans-serif;font-weight:700;font-size:34px;letter-spacing:6px;color:var(--lcars-orange)}
#loading h2{font-family:'Saira Condensed';font-weight:500;font-size:15px;letter-spacing:5px;color:var(--lcars-peach);margin-top:-14px}
.loadbar{width:min(420px,72vw);height:22px;border-radius:12px;background:#14131f;overflow:hidden;position:relative}
.loadbar i{display:block;height:100%;width:0%;border-radius:12px;
  background:linear-gradient(90deg,var(--lcars-purple),var(--lcars-magenta),var(--lcars-orange));transition:width .25s}
#loadtxt{font-size:14px;letter-spacing:3px;color:var(--lcars-blue)}
/* ============ LCARS 左栏 ============ */
#rail{position:fixed;left:0;top:0;bottom:0;width:132px;z-index:20;display:flex;flex-direction:column;
  padding:14px 12px 12px;gap:7px;transition:transform .35s cubic-bezier(.6,-0.2,.3,1.2)}
.cap{border-radius:26px;padding:12px 10px 10px;text-align:center;color:#0b0b12;font-family:Antonio,sans-serif;
  line-height:1.02;box-shadow:0 0 18px rgba(255,157,60,.18)}
.cap .t1{font-size:17px;letter-spacing:1.5px;font-weight:700}
.cap .t2{font-size:12.5px;letter-spacing:1px;font-weight:500;margin-top:3px;
  font-family:'Saira Condensed';color:#231708}
.cap.main{background:linear-gradient(160deg,#ffb84d,#ff8f2b)}
.cap.sub{background:linear-gradient(160deg,#d36ee0,#9a7ee8);color:#180a1c;font-size:12px;letter-spacing:1.2px;
  border-radius:16px;padding:7px 6px}
.rail-sep{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--lcars-purple),transparent)}
.lbtn{position:relative;border:0;cursor:pointer;border-radius:14px;padding:9px 8px 9px 16px;
  font-family:'Saira Condensed';font-weight:600;font-size:13.5px;letter-spacing:1.6px;color:#100c06;
  background:linear-gradient(180deg,#ffb051,#f58f28);text-align:left;transition:filter .15s,transform .1s;overflow:hidden}
.lbtn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,.28)}
.lbtn:hover{filter:brightness(1.12)}
.lbtn:active{transform:scale(.96)}
.lbtn.alt{background:linear-gradient(180deg,#a9b8f5,#7c9bea);color:#0a1020}
.lbtn.alt::before{background:rgba(0,0,0,.22)}
.lbtn.mag{background:linear-gradient(180deg,#e08fec,#c25fd0);color:#1c0a20}
.lbtn.on{box-shadow:0 0 0 2px #fff inset,0 0 16px rgba(255,157,60,.7)}
.rail-fill{flex:1}
.rail-mini{font-size:11px;letter-spacing:1.4px;color:var(--lcars-peach);text-align:center;line-height:1.5;opacity:.85}
/* ============ 右侧信息面板 ============ */
#info{position:fixed;right:14px;top:14px;width:292px;max-width:46vw;z-index:20;border-radius:18px;
  background:rgba(8,10,18,.72);border:1px solid rgba(255,157,60,.35);backdrop-filter:blur(6px);
  padding:0;overflow:hidden;transition:opacity .3s}
#info .ih{background:linear-gradient(90deg,var(--lcars-orange),var(--lcars-magenta));color:#100a04;
  font-family:Antonio,sans-serif;font-weight:700;font-size:16px;letter-spacing:2.5px;padding:8px 14px;border-radius:0}
#info .ih small{float:right;font-family:'Saira Condensed';font-weight:600;font-size:11px;letter-spacing:1px;
  line-height:22px;opacity:.75}
#info .ib{padding:11px 14px 13px;font-size:13.5px;line-height:1.62;color:#e9e4d8;
  font-family:'Saira Condensed';font-weight:400;letter-spacing:.4px;max-height:46vh;overflow:auto}
#info .ib b{color:var(--lcars-amber);font-weight:600}
#info .specs{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px;
  color:var(--lcars-peach);letter-spacing:.8px}
#info .specs span:nth-child(odd){color:#9fb4ef}
/* ============ 底部状态条 ============ */
#statusbar{position:fixed;left:150px;right:14px;bottom:12px;z-index:20;display:flex;align-items:center;gap:10px;
  border-radius:14px;background:rgba(8,10,18,.66);border:1px solid rgba(124,155,234,.3);
  padding:7px 14px;backdrop-filter:blur(5px);font-size:12.5px;letter-spacing:1.4px;color:var(--lcars-peach)}
#statusbar .sg{color:var(--lcars-blue)}
#statusbar .sep{flex:1}
#speedctl{display:flex;align-items:center;gap:6px}
#speedctl button{width:24px;height:20px;border-radius:6px;border:0;background:#2a2f45;color:var(--lcars-amber);
  font-weight:700;cursor:pointer;font-size:13px;line-height:1}
#speedval{min-width:96px;text-align:center;color:var(--lcars-amber);font-weight:600}
#helphint{opacity:.82}
#helphint b{color:var(--lcars-orange)}
/* ============ 准星 / 提示 / 移动端 ============ */
#crosshair{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);
  z-index:15;pointer-events:none;opacity:0;transition:opacity .3s}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:var(--lcars-amber);box-shadow:0 0 6px rgba(255,184,77,.8)}
#crosshair::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;right:0;height:2px;transform:translateY(-50%)}
#toast{position:fixed;left:50%;top:12%;transform:translateX(-50%) translateY(-14px);z-index:40;
  background:rgba(12,14,24,.9);border:1px solid var(--lcars-orange);color:var(--lcars-amber);
  padding:10px 22px;border-radius:22px;font-size:15px;letter-spacing:2px;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#mobilepad{display:none}
.joy{position:fixed;width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,157,60,.45);
  z-index:18;background:rgba(10,12,20,.25);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffc38a,#f58f28);transform:translate(-50%,-50%)}
#joyL{left:20px;bottom:30px}
#mlook{right:18px;bottom:30px;width:130px;height:130px;border-radius:50%;z-index:18;
  border:2px dashed rgba(124,155,234,.4);touch-action:none;display:none;align-items:center;justify-content:center;
  color:rgba(159,180,239,.7);font-size:12px;letter-spacing:2px;text-align:center}
#menutoggle{display:none;position:fixed;left:10px;top:10px;z-index:21;width:46px;height:46px;border-radius:12px;
  border:0;background:var(--lcars-orange);color:#000;font-size:20px;font-weight:700;cursor:pointer}
@media (max-width:820px),(pointer:coarse){
  #rail{transform:translateX(-110%);background:rgba(5,6,12,.92);width:200px;z-index:30}
  #rail.open{transform:translateX(0)}
  #menutoggle{display:block}
  #info{width:240px;max-width:60vw;top:8px;right:8px}
  #info .ib{max-height:30vh;font-size:12.5px}
  #statusbar{left:8px;right:8px;bottom:8px;flex-wrap:wrap;font-size:11px;padding:6px 10px}
  #helphint{display:none}
  #mobilepad{display:block}
  #mlook{display:flex}
}
</style>
</head>
<body>
<div id="app"></div>

<!-- 加载屏 -->
<div id="loading">
  <svg class="delta" viewBox="0 0 32 32"><path d="M16 3 L28 27 L16 22 L4 27 Z" fill="#ff9d3c"/><circle cx="16" cy="15" r="3.6" fill="#05060a"/></svg>
  <h1>U.S.S. ENTERPRISE</h1>
  <h2>NCC-1701-D · GALAXY CLASS</h2>
  <div class="loadbar"><i id="loadfill"></i></div>
  <div id="loadtxt">正在初始化星舰系统…</div>
</div>

<!-- LCARS 左栏 -->
<button id="menutoggle" aria-label="菜单">≡</button>
<nav id="rail">
  <div class="cap main"><div class="t1">U.S.S.<br>ENTERPRISE</div><div class="t2">NCC-1701-D</div></div>
  <div class="cap sub">GALAXY CLASS · EXPLORER</div>
  <div class="rail-sep"></div>
  <button class="lbtn on" data-loc="exterior">外部全景</button>
  <button class="lbtn" data-loc="bridge">舰　桥</button>
  <button class="lbtn" data-loc="tenforward">十前酒廊</button>
  <button class="lbtn" data-loc="shuttlebay">穿梭机库</button>
  <button class="lbtn" data-loc="engineering">轮机室</button>
  <button class="lbtn" data-loc="corridor">碟部走廊</button>
  <div class="rail-sep"></div>
  <button class="lbtn alt" id="btnDoor">机库大门：开启</button>
  <button class="lbtn mag" id="btnWarp">曲速跳跃</button>
  <button class="lbtn alt" id="btnSound">环境音：关</button>
  <div class="rail-fill"></div>
  <div class="rail-mini">星际联邦星舰<br>42 层甲板 · 1014 名船员</div>
</nav>

<!-- 右侧信息 -->
<aside id="info">
  <div class="ih" id="infoTitle">外部空间 <small id="infoLoc">EXTERIOR</small></div>
  <div class="ib" id="infoBody"></div>
</aside>

<!-- 准星 -->
<div id="crosshair"></div>

<!-- 底部状态 -->
<div id="statusbar">
  <span class="sg">位置</span><span id="curLoc">外部空间</span>
  <span class="sep"></span>
  <div id="speedctl">
    <button id="spdDown">−</button><span id="speedval">巡航 · 30 m/s</span><button id="spdUp">＋</button>
  </div>
  <span class="sep"></span>
  <span id="coords">X 0 · Y 0 · Z 0</span>
  <span class="sep"></span>
  <span id="helphint"><b>WASD</b> 移动 · <b>Q/E</b> 升降 · <b>Shift</b> 加速 · <b>拖拽</b> 视角 · <b>滚轮</b> 速度</span>
</div>

<div id="toast"></div>

<!-- 移动端控制 -->
<div id="mobilepad">
  <div class="joy" id="joyL"><i></i></div>
  <div id="mlook">拖动<br>转视角</div>
</div>

<!-- Three.js r128 UMD -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
'use strict';
/* =====================================================================================
   U.S.S. ENTERPRISE NCC-1701-D (Galaxy Class) — 程序化可探索模型
   坐标系：舰首 -Z，舰尾 +Z；右舷 +X；上 +Y；单位 = 米
   ===================================================================================== */

/* =====================================================================================
   纹理库：全部 Canvas 程序化生成
   ===================================================================================== */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[(Math.random()*arr.length)|0];}
function finishTex(canvas,rx,ry,srgb){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(rx)t.repeat.set(rx,ry||rx);
  if(srgb!==false)t.encoding=THREE.sRGBEncoding;
  t.anisotropy=8; return t;
}
/* 舰体 aztec 拼板纹理（碟部 / 工程舰体 / 曲速舱通用，靠色差与板线区分） */
function aztecTexture(base,seam,palette,cell){
  const S=1024,[c,g]=mkCanvas(S,S);
  g.fillStyle=base;g.fillRect(0,0,S,S);
  for(let y=0;y<S;y+=cell){
    const off=((y/cell)|0)%2?cell*0.5:0;
    for(let x=-cell;x<S;x+=cell){
      const w=cell*rnd(.8,1.15),h=cell*rnd(.7,1.05);
      g.fillStyle=pick(palette);g.fillRect(x+off+1,y+1,w-2,h-2);
      g.strokeStyle=seam;g.lineWidth=2;g.strokeRect(x+off+1,y+1,w-2,h-2);
      if(Math.random()<.5){ // 板内细分
        g.strokeStyle='rgba(70,78,86,.35)';g.lineWidth=1;
        g.beginPath();g.moveTo(x+off+w*.5,y+3);g.lineTo(x+off+w*.5,y+h-3);g.stroke();
      }
      if(Math.random()<.18){ g.fillStyle='rgba(60,66,74,.5)';g.fillRect(x+off+6,y+6,10,3); }
    }
  }
  return finishTex(c,1,1);
}
/* 舷窗灯带：多行密集小窗 */
function windowBandTexture(rows,tint,bg){
  const [c,g]=mkCanvas(512,128);
  g.fillStyle=bg||'#141a22';g.fillRect(0,0,512,128);
  const rowH=128/rows;
  for(let r=0;r<rows;r++){
    for(let x=4;x<512;x+=11){
      if(Math.random()<.12)continue;
      const warm=Math.random()<.82;
      g.fillStyle=warm?(tint||'#ffd9a0'):pick(['#9fc8ff','#bfe8d8','#ffb88a']);
      g.globalAlpha=rnd(.55,1);
      g.fillRect(x,r*rowH+rowH*.28,4.5,rowH*.42);
      g.globalAlpha=1;
    }
    g.fillStyle='rgba(120,130,140,.35)';g.fillRect(0,r*rowH+rowH-2,512,1.5);
  }
  return finishTex(c,1,1);
}
/* 舰名注册号贴花 */
function registryTexture(text,color,w,h,fs){
  const [c,g]=mkCanvas(w||1024,h||256);
  g.clearRect(0,0,w,h);
  g.fillStyle=color||'#232b36';g.font='900 '+(fs||158)+'px "Arial Black",Arial,sans-serif';
  g.textAlign='center';g.textBaseline='middle';
  g.shadowColor='rgba(255,255,255,.25)';g.shadowBlur=2;g.shadowOffsetY=-1;
  g.fillText(text,w/2,h/2+6);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
/* 联邦星际舰队标志（delta） */
function fedLogoTexture(){
  const [c,g]=mkCanvas(256,256);
  g.translate(128,128);
  g.fillStyle='#d8dde2';g.beginPath();g.ellipse(0,0,104,118,0,0,Math.PI*2);g.fill();
  g.strokeStyle='#7c848e';g.lineWidth=8;g.stroke();
  g.fillStyle='#b7402f';g.beginPath();g.moveTo(0,-80);g.lineTo(66,82);g.lineTo(0,52);g.lineTo(-66,82);g.closePath();g.fill();
  g.fillStyle='#f2e9d2';g.beginPath();g.moveTo(0,-52);g.lineTo(34,50);g.lineTo(0,32);g.lineTo(-34,50);g.closePath();g.fill();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}
/* 曲速舱前端 Bussard 收集器穹顶纹理 */
function bussardTexture(){
  const [c,g]=mkCanvas(256,256);
  const gr=g.createRadialGradient(100,90,20,128,128,150);
  gr.addColorStop(0,'#ff9a66');gr.addColorStop(.55,'#e25028');gr.addColorStop(1,'#8c1c12');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  g.strokeStyle='rgba(90,10,4,.65)';g.lineWidth=2;
  for(let i=1;i<8;i++){g.beginPath();g.ellipse(128,128,i*22,i*22*.96,0,0,Math.PI*2);g.stroke();}
  for(let a=0;a<Math.PI;a+=Math.PI/8){g.beginPath();g.moveTo(128,128);g.lineTo(128+Math.cos(a)*180,128+Math.sin(a)*180);g.stroke();}
  g.strokeStyle='rgba(255,200,150,.5)';g.lineWidth=1.5;
  for(let a=Math.PI;a<Math.PI*2;a+=Math.PI/8){g.beginPath();g.moveTo(128,128);g.lineTo(128+Math.cos(a)*180,128+Math.sin(a)*180);g.stroke();}
  return finishTex(c,1,1);
}
/* 曲速舱侧面等离子格栅 */
function grilleTexture(){
  const [c,g]=mkCanvas(512,128);
  g.fillStyle='#04101c';g.fillRect(0,0,512,128);
  for(let i=0;i<14;i++){
    const y=10+i*8;
    const gr=g.createLinearGradient(0,0,512,0);
    gr.addColorStop(0,'rgba(40,120,230,0)');gr.addColorStop(.15,'#3fa8ff');
    gr.addColorStop(.85,'#7fd0ff');gr.addColorStop(1,'rgba(40,120,230,0)');
    g.fillStyle=gr;g.fillRect(6,y,500,3.4);
  }
  g.strokeStyle='rgba(120,180,255,.25)';
  for(let x=20;x<512;x+=24){g.beginPath();g.moveTo(x,6);g.lineTo(x,122);g.stroke();}
  return finishTex(c,1,1);
}
/* 机库甲板 */
function deckTexture(){
  const S=1024,[c,g]=mkCanvas(S,S);
  g.fillStyle='#3b4148';g.fillRect(0,0,S,S);
  g.strokeStyle='#2a2f35';g.lineWidth=3;
  for(let i=0;i<=S;i+=128){g.beginPath();g.moveTo(i,0);g.lineTo(i,S);g.moveTo(0,i);g.lineTo(S,i);g.stroke();}
  g.strokeStyle='#c9a23a';g.lineWidth=10;g.setLineDash([40,26]);
  g.beginPath();g.arc(S/2,S/2,300,0,Math.PI*2);g.stroke();g.setLineDash([]);
  g.strokeStyle='#d8b54a';g.lineWidth=8;g.beginPath();g.moveTo(S/2,0);g.lineTo(S/2,S);g.stroke();
  g.fillStyle='#1d2126';
  for(let y=0;y<S;y+=64){g.fillRect(0,y,S,14);g.fillStyle='#d8b54a';for(let x=0;x<S;x+=64){g.fillRect(x+(y/64%2?32:0),y,32,14);}g.fillStyle='#1d2126';}
  return finishTex(c,2,2);
}
/* 走廊地板：中央走道 */
function corridorFloorTexture(){
  const [c,g]=mkCanvas(256,512);
  g.fillStyle='#c9c4b8';g.fillRect(0,0,256,512);
  g.fillStyle='#5d7d8c';g.fillRect(88,0,80,512);
  g.fillStyle='#8aa2ac';g.fillRect(96,0,64,512);
  g.strokeStyle='#9a958a';g.lineWidth=2;
  for(let y=0;y<512;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(256,y);g.stroke();}
  return finishTex(c,1,6);
}
/* 室内墙板 */
function wallPanelTexture(base,seam){
  const [c,g]=mkCanvas(256,256);
  g.fillStyle=base;g.fillRect(0,0,256,256);
  g.strokeStyle=seam;g.lineWidth=2;
  for(let y=0;y<=256;y+=64)for(let x=0;x<=256;x+=128){g.strokeRect(x+1,y+1,126,62);}
  g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,0,256,40);
  return finishTex(c,1,1);
}
/* 星云 sprite */
function nebulaTexture(stops){
  const [c,g]=mkCanvas(512,512);
  g.globalCompositeOperation='lighter';
  for(let i=0;i<26;i++){
    const x=rnd(120,392),y=rnd(120,392),r=rnd(90,260);
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    const col=pick(stops);
    gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');

function bridgeScreen(){
  const [c,g]=mkCanvas(768,384);

  const stars=[];for(let i=0;i<220;i++)stars.push([rnd(0,768),rnd(0,384),rnd(.5,2.2),rnd(.3,1)]);
  function draw(t){
    g.fillStyle='#040814';g.fillRect(0,0,768,384);

    for(const s of stars){
      g.fillStyle='rgba(255,255,255,'+s[3]+')';

    g.strokeStyle='rgba(90,150,255,.28)';g.lineWidth=1;

    for(let y=0;y<384;y+=48){g.beginPath();g.moveTo(0,y);g.lineTo(768,y);g.stroke();}
    // 扇形扫描
    const cx=384,cy=210,R=250;
    const a=t*0.9;

    g.strokeStyle='rgba(120,200,255,.5)';
    for(let r=60;r<=R;r+=60){g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke();}
    g.strokeStyle='#57c8ff';g.lineWidth=2;
    g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.stroke();g.lineWidth=1;

    g.fillStyle='#ffb84d';g.beginPath();g.arc(180+Math.sin(t*.3)*30,120,5,0,Math.PI*2);g.fill();

function starfieldTex(){

}

/* ---------- 碰撞 ---------- */
const inBox=(p,mn,mx)=>p.x>=mn.x&&p.x<=mx.x&&p.y>=mn.y&&p.y<=mx.y&&p.z>=mn.z&&p.z<=mx.z;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function pushEllipsoid(p,el){
  const qx=(p.x-el.c.x)/el.r.x,qy=(p.y-el.c.y)/el.r.y,qz=(p.z-el.c.z)/el.r.z,l=Math.hypot(qx,qy,qz);
  if(l<1){if(l<1e-5){p.y=el.c.y+el.r.y+.1;return;}
    p.x=el.c.x+qx/l*el.r.x*1.002;p.y=el.c.y+qy/l*el.r.y*1.002;p.z=el.c.z+qz/l*el.r.z*1.002;}
}
function pushCapsule(p,c){
  const cz=c.c.z+clamp(p.z-c.c.z,-c.rz,c.rz);
  const dx=p.x-c.c.x,dy=p.y-c.c.y,l=Math.hypot(dx,dy);
  if(l<c.rad){if(l<1e-4){p.y=c.c.y+c.rad+.1;return;}
    p.x=c.c.x+dx/l*c.rad*1.002;p.y=c.c.y+dy/l*c.rad*1.002;}
}
function pushAABB(p,mn,mx){
  if(!inBox(p,mn,mx))return;
  const px=Math.min(p.x-mn.x,mx.x-p.x),py=Math.min(p.y-mn.y,mx.y-p.y),pz=Math.min(p.z-mn.z,mx.z-p.z);
  const m=Math.min(px,py,pz);
  if(m===px)p.x=p.x-mn.x<mx.x-p.x?mn.x-.1:mx.x+.1;
  else if(m===py)p.y=p.y-mn.y<mx.y-p.y?mn.y-.1:mx.y+.1;
  else p.z=p.z-mn.z<mx.z-p.z?mn.z-.1:mx.z+.1;
}
function collide(loc,p){
  if(loc==='exterior'){
    const inEntry=inBox(p,WORLD.entryCorridor.min,WORLD.entryCorridor.max);
    WORLD.ellips.forEach((el,i)=>{if(!(inEntry&&i===2))pushEllipsoid(p,el);});
    WORLD.caps.forEach(c=>pushCapsule(p,c));
    WORLD.boxes.forEach(b=>pushAABB(p,b.min,b.max));
    if(APP.doorOpen&&inBox(p,WORLD.bayEnter.min,WORLD.bayEnter.max))enterLoc('shuttlebay');
  }else if(loc==='shuttlebay'){
    const atDoor=Math.abs(p.x)<34&&p.y<-30&&p.y>-61&&p.z>148;
    if(APP.doorOpen&&atDoor){if(p.z>167){enterLoc('exterior');return;}p.x=clamp(p.x,-34,34);}
    else{p.x=clamp(p.x,-39,39);p.z=clamp(p.z,37,157);}
    p.y=clamp(p.y,-61.6,-9);
  }else if(loc==='corridor'){
    const r=Math.hypot(p.x,p.z),tr=clamp(r,141,151);
    if(r>0){p.x*=tr/r;p.z*=tr/r;}
    const th=clamp(Math.atan2(p.x,p.z),-.72,.72);
    p.x=Math.sin(th)*tr;p.z=Math.cos(th)*tr;
    p.y=clamp(p.y,47.2,55.4);
  }else{
    const b=WORLD.bounds[loc];
    if(b){p.x=clamp(p.x,b.min.x,b.max.x);p.y=clamp(p.y,b.min.y,b.max.y);p.z=clamp(p.z,b.min.z,b.max.z);}
  }
}

let actx=null,master=null,oscA,oscB;
function initAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();master.gain.value=.05;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;master.connect(lp);lp.connect(actx.destination);
  oscA=actx.createOscillator();oscA.type='sine';oscA.frequency.value=46;
  oscB=actx.createOscillator();oscB.type='triangle';oscB.frequency.value=61.3;
  const g2=actx.createGain();g2.gain.value=.4;
  oscA.connect(master);oscB.connect(g2);g2.connect(master);oscA.start();oscB.start();
}
let soundOn=false;
document.getElementById('btnSound').addEventListener('click',function(){
  if(!actx)initAudio();

function warpAudio(){if(!soundOn||!actx)return;
  oscA.frequency.cancelScheduledValues(actx.currentTime);
  oscA.frequency.setValueAtTime(46,actx.currentTime);
  oscA.frequency.exponentialRampToValueAtTime(96,actx.currentTime+.7);
  oscA.frequency.exponentialRampToValueAtTime(46,actx.currentTime+2.6);
}

   主循环
   ===================================================================================== */
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_up=new THREE.Vector3(0,1,0);
function updateCamera(dt){
  if(APP.transit){
    const tr=APP.transit;tr.t+=dt/tr.dur;const k=tr.t<.5?2*tr.t*tr.t:1-Math.pow(-2*tr.t+2,2)/2;
    camera.position.lerpVectors(tr.fromPos,tr.toPos,k);
    camera.quaternion.slerpQuaternions(tr.fromQuat,tr.toQuat,k);
    if(k>.5&&!tr.switched){tr.switched=true;enterLoc(tr.target);}
    if(tr.t>=1){APP.transit=null;syncAngles();}
    return;
  }
  if(!ctrl.interacted){ // 自动环绕
    cineTheta+=dt*.045;
    camera.position.set(Math.sin(cineTheta)*920,270+Math.sin(cineTheta*.6)*70,Math.cos(cineTheta)*920);
    camera.lookAt(0,20,0);syncAngles();return;
  }
  camera.quaternion.setFromEuler(new THREE.Euler(ctrl.pitch,ctrl.yaw,0,'YXZ'));
  const k=ctrl.keys;
  let f=(k.KeyW?1:0)-(k.KeyS?1:0),s=(k.KeyD?1:0)-(k.KeyA?1:0),u=(k.KeyE||k.Space?1:0)-(k.KeyQ?1:0);
  f-=ctrl.joy.y;s+=ctrl.joy.x;
  if(f||s||u){
    const spd=ctrl.speeds[ctrl.spd]*(k.ShiftLeft||k.ShiftRight?3:1)*(['exterior','shuttlebay'].includes(APP.loc)?1:.42);
    camera.getWorldDirection(_v1);_v2.crossVectors(_v1,_up).normalize();
    const move=new THREE.Vector3();
    move.addScaledVector(_v1,f).addScaledVector(_v2,s).addScaledVector(_up,u);
    if(move.lengthSq()>0)move.normalize().multiplyScalar(spd*dt);
    camera.position.add(move);collide(APP.loc,camera.position);
  }
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(APP.clock.getDelta(),.05),t=APP.clock.elapsedTime;
  if(APP.hidden)return;
  updateCamera(dt);
  // 机库门
  const target=APP.doorOpen?1:0;
  APP.doorAmt+=(target-APP.doorAmt)*Math.min(1,dt*2.6);
  const a=APP.doorAmt;
  bayDoors.forEach(d=>{d.position.x=d.userData.side*(20+20*a);d.position.z=168-18*a;});
  if(APP.bayDoorGroups)APP.bayDoorGroups.forEach(d=>{d.g.position.x=d.s*(18+28*a);});
  // 灯光闪烁与动画
  blinkers.forEach(b=>{b.m.material.emissiveIntensity=b.base*(Math.sin(t*2.6+b.phase)>.55?1.25:.22);});
  APP.animated.forEach(fn=>fn(t));
  if(APP.screen)APP.screen.update(t);
  planet.rotation.y+=dt*.008;clouds.rotation.y+=dt*.012;
  updateWarp(dt);
  composer.render();
  document.getElementById('coords').textContent=
    'X '+Math.round(camera.position.x)+' · Y '+Math.round(camera.position.y)+' · Z '+Math.round(camera.position.z);
  document.getElementById('speedval').textContent=['慢行 · 8 m/s','巡航 · 30 m/s','全速 · 90 m/s'][ctrl.spd]+
    ((ctrl.keys.ShiftLeft||ctrl.keys.ShiftRight)?' ×3':'');
}
function fadeLoading(){
  if(APP.loaded)return;APP.loaded=true;
  const fill=document.getElementById('loadfill');fill.style.width='100%';
  document.getElementById('loadtxt').textContent='星舰系统就绪 · 欢迎登舰';
  setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity='0';
    setTimeout(()=>l.remove(),900);toast('拖拽环视 · WASD 飞行 · 从左栏进入舰内');},400);
}
animate();
window.__sceneReady=true;
fadeLoading();
// 兜底：若首帧异常，3.5 秒后也收起加载屏
setTimeout(fadeLoading,3500);
